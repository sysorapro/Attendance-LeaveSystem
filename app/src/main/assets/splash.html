<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08152b}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#2556a0 0%,#1a3353 48%,#08152b 100%);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.38;animation:float 7s ease-in-out infinite}
.o1{width:46vw;height:46vw;background:#2f80ed;left:-12vw;top:8vh}
.o2{width:40vw;height:40vw;background:#f59e0b;right:-14vw;bottom:14vh;opacity:.16;animation-delay:-3s}
.o3{width:34vw;height:34vw;background:#22d3ee;right:6vw;top:4vh;opacity:.22;animation-delay:-5s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,-3vh)}}

/* ── Fingerprint ── */
.fp{position:relative;width:min(52vw,220px);aspect-ratio:200/240;margin-top:-3vh}
.ring{position:absolute;inset:-4% -12%;border-radius:50%;border:2px solid rgba(127,227,255,.5);opacity:0;
  animation:ripple 2.8s ease-out 1.2s infinite}
.ring:nth-child(2){animation-delay:2.1s}
.ring:nth-child(3){animation-delay:3s}
@keyframes ripple{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.35);opacity:0}}
.tip{position:absolute;inset:0;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;
  background:radial-gradient(ellipse at 50% 42%,rgba(127,227,255,.20),rgba(255,255,255,.04) 72%);
  box-shadow:inset 0 0 26px rgba(127,227,255,.2),0 0 30px rgba(47,128,237,.35)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:glow 2.6s ease-in-out 2s infinite}
.ridge{fill:none;stroke:#8fe6ff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:100;stroke-dashoffset:100;
  animation:draw .9s cubic-bezier(.4,0,.2,1) calc(var(--i) * .05s + .1s) forwards,
            wave 2.6s ease-in-out calc(var(--i) * .1s + 2s) infinite}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes wave{0%,100%{stroke:#7fdcff;stroke-opacity:.7}45%{stroke:#ffffff;stroke-opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px rgba(127,227,255,.45))}50%{filter:drop-shadow(0 0 10px rgba(127,227,255,.95))}}
.edge{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.4}
.scan{position:absolute;left:5%;right:5%;height:3px;border-radius:3px;top:6%;opacity:0;
  background:linear-gradient(90deg,transparent,#b4f2ff,transparent);box-shadow:0 0 16px 5px rgba(127,227,255,.7);
  animation:scan 2.1s ease-in-out 2.2s infinite alternate}
@keyframes scan{0%{top:6%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:92%;opacity:0}}

/* ── Logo ── */
.logo{margin-top:4vh;width:min(72vw,310px);opacity:0;transform:translateY(18px) scale(.94);
  animation:pop .9s cubic-bezier(.2,.9,.3,1.15) 1.2s forwards}
.logo img{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
@keyframes pop{to{opacity:1;transform:none}}

/* ── Tag + progress ── */
.tag{margin-top:16px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.82);
  opacity:0;animation:fade .8s ease 1.9s forwards}
.pct{margin-top:14px;font-size:15px;font-weight:600;letter-spacing:1px;color:#bfeeff;font-variant-numeric:tabular-nums;
  opacity:0;animation:fade .6s ease 1.6s forwards}
.bar{margin-top:8px;width:min(56vw,220px);height:5px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;
  opacity:0;animation:fade .6s ease 1.6s forwards}
.bar i{display:block;height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,#4dc3ff,#c8f4ff);
  box-shadow:0 0 10px rgba(127,227,255,.8)}
@keyframes fade{to{opacity:1}}
</style></head>
