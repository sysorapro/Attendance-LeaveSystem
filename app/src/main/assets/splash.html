<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08152b}
body{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#2556a0 0%,#1a3353 48%,#08152b 100%);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.38;animation:float 7s ease-in-out infinite}
.o1{width:46vw;height:46vw;background:#2f80ed;left:-12vw;top:8vh}
.o2{width:40vw;height:40vw;background:#f59e0b;right:-14vw;bottom:14vh;opacity:.16;animation-delay:-3s}
.o3{width:34vw;height:34vw;background:#22d3ee;right:6vw;top:4vh;opacity:.22;animation-delay:-5s}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(4vw,-3vh)}}

/* ── Fingerprint ── */
.fp{position:relative;width:min(50vw,210px);aspect-ratio:200/240;margin-top:-3vh}
.ring{position:absolute;inset:-4% -12%;border-radius:50%;border:2px solid rgba(127,227,255,.55);opacity:0;
  animation:ripple 2.8s ease-out .8s infinite}
.ring:nth-child(2){animation-delay:1.7s}
.ring:nth-child(3){animation-delay:2.6s}
@keyframes ripple{0%{transform:scale(.75);opacity:.65}100%{transform:scale(1.35);opacity:0}}
.tip{position:absolute;inset:0;border-radius:50% 50% 46% 46%/42% 42% 58% 58%;
  background:radial-gradient(ellipse at 50% 45%,rgba(127,227,255,.16),rgba(255,255,255,.04) 70%);
  border:1.5px solid rgba(255,255,255,.20);box-shadow:inset 0 0 28px rgba(127,227,255,.18)}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:glow 2.4s ease-in-out 1.8s infinite}
.ridge{fill:none;stroke:url(#g);stroke-width:2.7;stroke-linecap:round;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:calc(var(--p) * -1px)}}
.reveal{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:grow 1.7s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes grow{to{transform:scale(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 3px rgba(127,227,255,.5))}50%{filter:drop-shadow(0 0 11px rgba(127,227,255,.95))}}
.scan{position:absolute;left:6%;right:6%;height:3px;border-radius:3px;top:8%;opacity:0;
  background:linear-gradient(90deg,transparent,#a8f0ff,transparent);box-shadow:0 0 16px 5px rgba(127,227,255,.65);
  animation:scan 2s ease-in-out 1.9s infinite alternate}
@keyframes scan{0%{top:8%;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:90%;opacity:0}}

/* ── Logo (transparent) ── */
.logo{margin-top:4vh;width:min(70vw,300px);opacity:0;transform:translateY(18px) scale(.94);
  animation:pop .9s cubic-bezier(.2,.9,.3,1.15) 1.1s forwards}
.logo img{display:block;width:100%;height:auto;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 12px rgba(255,255,255,.38))}
@keyframes pop{to{opacity:1;transform:none}}

/* ── Tag + progress ── */
.tag{margin-top:16px;font-size:12px;letter-spacing:4px;text-transform:uppercase;color:rgba(255,255,255,.8);
  opacity:0;animation:fade .8s ease 1.8s forwards}
.pct{margin-top:14px;font-size:15px;font-weight:600;letter-spacing:1px;color:#bfeeff;font-variant-numeric:tabular-nums;
  opacity:0;animation:fade .6s ease 1.5s forwards}
.bar{margin-top:8px;width:min(56vw,220px);height:5px;border-radius:5px;background:rgba(255,255,255,.16);overflow:hidden;
  opacity:0;animation:fade .6s ease 1.5s forwards}
.bar i{display:block;height:100%;width:0%;border-radius:5px;background:linear-gradient(90deg,#4dc3ff,#c8f4ff);
  box-shadow:0 0 10px rgba(127,227,255,.8)}
@keyframes fade{to{opacity:1}}
</style></head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="fp">
  <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  <div class="tip"></div>
  <svg viewBox="0 0 200 240" aria-hidden="true">
    <defs>
      <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="230">
        <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#6fdcff"/>
      </linearGradient>
      <clipPath id="clip"><path d="M100 6 C150 6 186 48 186 112 C186 168 172 214 140 232 Q100 244 60 232 C28 214 14 168 14 112 C14 48 50 6 100 6 Z"/></clipPath>
      <mask id="m" maskUnits="userSpaceOnUse" x="-40" y="-40" width="280" height="320">
        <circle class="reveal" cx="100" cy="120" r="150" fill="#fff"/>
      </mask>
    </defs>
    <g clip-path="url(#clip)"><g mask="url(#m)">
        <ellipse class="ridge" cx="100" cy="120" rx="7.0" ry="10.0" transform="rotate(-1.8 100 120)" style="stroke-dasharray:13 2.2;--p:15.2;animation-duration:5.6s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="12.3" ry="18.7" transform="rotate(0.0 100 120)" style="stroke-dasharray:9 2.2;--p:11.2;animation-duration:3.2s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="17.7" ry="24.0" transform="rotate(1.8 100 120)" style="stroke-dasharray:13 3.8;--p:16.8;animation-duration:3.2s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="23.0" ry="27.9" transform="rotate(-1.8 100 120)" style="stroke-dasharray:11 2.2;--p:13.2;animation-duration:3.2s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="28.4" ry="34.5" transform="rotate(0.0 100 120)" style="stroke-dasharray:16 3;--p:19.0;animation-duration:3.2s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="33.8" ry="43.7" transform="rotate(1.8 100 120)" style="stroke-dasharray:11 2.2;--p:13.2;animation-duration:5.6s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="39.1" ry="51.4" transform="rotate(-1.8 100 120)" style="stroke-dasharray:9 3.8;--p:12.8;animation-duration:3.2s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="44.4" ry="55.8" transform="rotate(0.0 100 120)" style="stroke-dasharray:11 3.8;--p:14.8;animation-duration:3.2s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="49.8" ry="60.2" transform="rotate(1.8 100 120)" style="stroke-dasharray:16 2.2;--p:18.2;animation-duration:4s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="55.1" ry="68.1" transform="rotate(-1.8 100 120)" style="stroke-dasharray:9 3.8;--p:12.8;animation-duration:4s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="60.5" ry="77.3" transform="rotate(0.0 100 120)" style="stroke-dasharray:13 3;--p:16.0;animation-duration:4s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="65.8" ry="83.7" transform="rotate(1.8 100 120)" style="stroke-dasharray:9 3.8;--p:12.8;animation-duration:4.8s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="71.2" ry="87.6" transform="rotate(-1.8 100 120)" style="stroke-dasharray:11 2.2;--p:13.2;animation-duration:4s;animation-direction:normal"/>
        <ellipse class="ridge" cx="100" cy="120" rx="76.5" ry="93.0" transform="rotate(0.0 100 120)" style="stroke-dasharray:13 2.2;--p:15.2;animation-duration:3.2s;animation-direction:reverse"/>
        <ellipse class="ridge" cx="100" cy="120" rx="81.9" ry="101.8" transform="rotate(1.8 100 120)" style="stroke-dasharray:9 3.8;--p:12.8;animation-duration:4s;animation-direction:normal"/>
        <path class="ridge" d="M 14 200 Q 100 168 186 200" style="stroke-dasharray:14 3;--p:17;animation-duration:4.0s;animation-direction:reverse"/>
        <path class="ridge" d="M 14 209 Q 100 177 186 209" style="stroke-dasharray:14 3;--p:17;animation-duration:4.4s;animation-direction:normal"/>
        <path class="ridge" d="M 14 218 Q 100 186 186 218" style="stroke-dasharray:14 3;--p:17;animation-duration:4.8s;animation-direction:reverse"/>
        <path class="ridge" d="M 14 227 Q 100 195 186 227" style="stroke-dasharray:14 3;--p:17;animation-duration:5.2s;animation-direction:normal"/>
        <path class="ridge" d="M 14 236 Q 100 204 186 236" style="stroke-dasharray:14 3;--p:17;animation-duration:5.6s;animation-direction:reverse"/>
    </g></g>
  </svg>
  <div class="scan"></div>
</div>

<div class="logo"><img src="logo.png" alt="SYSORA Pro"></div>
<div class="tag">Attendance &amp; Leave</div>
<div class="pct" id="pct">0%</div>
<div class="bar"><i id="fill"></i></div>

<script>
var shown = 0, target = 6;
window.setProgress = function (p) { p = Math.max(0, Math.min(100, +p || 0)); if (p > target) target = p; };
function tick() {
  if (shown < target) { shown += Math.max(0.35, (target - shown) * 0.07); if (shown > target) shown = target; }
  var v = Math.round(shown);
  document.getElementById('pct').textContent = v + '%';
  document.getElementById('fill').style.width = shown + '%';
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body></html>
