
<script>
// ============================================================
// AdminPages.js — Admin & Manager Page Renderers
// ============================================================

// ── Employees ────────────────────────────────────────────────
async function renderEmployees() {
  const container = document.getElementById('pageContent');
  const [empsRes, deptsRes, sectsRes] = await Promise.all([
    api('getEmployees', {}),
    api('getDepartments', {}),
    api('getSections', {}),
  ]);
  const employees = empsRes.success  ? empsRes.data  : [];
  const depts     = deptsRes.success ? deptsRes.data : [];
  const sects     = sectsRes.success ? sectsRes.data : [];

  const deptMap = {}; depts.forEach(d => { deptMap[d.DepartmentID] = APP.lang==='ar' ? d.DepartmentNameAr : d.DepartmentNameEn; });
  const sectMap = {}; sects.forEach(s => { sectMap[s.SectionID]    = APP.lang==='ar' ? s.SectionNameAr    : s.SectionNameEn;    });

  const deptOpts = depts.map(d => `<option value="${d.DepartmentID}">${APP.lang==='ar'?d.DepartmentNameAr:d.DepartmentNameEn}</option>`).join('');
  const sectOpts = sects.map(s => `<option value="${s.SectionID}">${APP.lang==='ar'?s.SectionNameAr:s.SectionNameEn}</option>`).join('');

  const rows = employees.map(e => `
    <tr>
      <td><span class="fw-bold">${e.EmployeeCode}</span></td>
      <td>${e.EmployeeNameAr}</td>
      <td>${e.EmployeeNameEn}</td>
      <td>${deptMap[e.DepartmentID] || '—'}</td>
      <td>${sectMap[e.SectionID] || '—'}</td>
      <td>${e.JobGrade || '—'}</td>
      <td><span class="badge-status ${e.WorkType==='Flexible'?'badge-info':'badge-secondary'}">${e.WorkType==='Flexible'?t('flexible'):t('normal')}</span></td>
      <td><span class="badge-status ${String(e.ActiveFlag).toLowerCase()!=='false'?'badge-success':'badge-danger'}">${String(e.ActiveFlag).toLowerCase()!=='false'?t('active'):t('inactive')}</span></td>
      <td class="action-btns">
        <button class="btn btn-sm btn-outline-primary" onclick="openEmpModal(${JSON.stringify(e).replace(/"/g,'&quot;')})">
          <span class="material-icons-round">edit</span></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteEmp('${e.EmployeeCode}')">
          <span class="material-icons-round">delete</span></button>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <div class="page-header">
      <div><div class="page-header-title">${t('employees')}</div>
        <div class="page-header-sub">${t('totalCount')}: ${employees.length} ${t('employees')}</div></div>
      <button class="btn btn-primary" onclick="openEmpModal(null)">
        <span class="material-icons-round">person_add</span>${t('add')}</button>
    </div>
    <div class="filter-bar row g-2 align-items-end mb-3">
      <div class="col-md-4">
        <div class="search-bar"><input type="text" class="form-control" id="empSearch" placeholder="${t('search')}..." oninput="filterEmpTable(this.value)">
          <span class="material-icons-round search-icon">search</span></div></div>
      <div class="col-md-3"><select class="form-select" id="empDeptFilter" onchange="filterEmpTable()">
        <option value="">${t('allDepartments')}</option>${deptOpts}</select></div>
    </div>
    <div class="card"><div class="card-body p-0 data-table-wrapper">
      ${employees.length ? `
      <table class="data-table" id="empTable">
        <thead><tr>
          <th>${t('code')}</th><th>${t('nameAr')}</th><th>${t('nameEn')}</th>
          <th>${t('department')}</th><th>${t('section')}</th><th>${t('jobGrade')}</th>
          <th>${t('workType')}</th><th>${t('active')}</th><th>${t('actions')}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty-state"><span class="material-icons-round">people</span><div>${t('noData')}</div></div>`}
    </div></div>

    <!-- Employee Modal -->
    <div class="modal fade" id="empModal" tabindex="-1">
      <div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="empModalTitle">${t('addEmployee')}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="empCode">
          <div class="row g-3">
            <div class="col-md-4"><label class="form-label">${t('code')} *</label>
              <input class="form-control" id="empCodeInput" placeholder="EMP001"></div>
            <div class="col-md-4"><label class="form-label">${t('nameAr')} *</label>
              <input class="form-control" id="empNameAr"></div>
            <div class="col-md-4"><label class="form-label">${t('nameEn')}</label>
              <input class="form-control" id="empNameEn"></div>
            <div class="col-md-4"><label class="form-label">${t('jobGrade')}</label>
              <input class="form-control" id="empGrade"></div>
            <div class="col-md-4"><label class="form-label">${t('department')}</label>
              <select class="form-select" id="empDept" onchange="loadSectionsByDept(this.value,'empSect')">
                <option value="">${t('selectOption')}</option>${deptOpts}</select></div>
            <div class="col-md-4"><label class="form-label">${t('section')}</label>
              <select class="form-select" id="empSect"><option value="">${t('selectOption')}</option>${sectOpts}</select></div>
            <div class="col-md-4"><label class="form-label">${t('mobile')}</label>
              <input class="form-control" id="empMobile" type="tel"></div>
            <div class="col-md-4"><label class="form-label">${t('email')}</label>
              <input class="form-control" id="empEmail" type="email"></div>
            <div class="col-md-4"><label class="form-label">${t('workType')}</label>
              <select class="form-select" id="empWorkType">
                <option value="Normal">${t('normal')}</option>
                <option value="Flexible">${t('flexible')}</option>
              </select></div>
            <div class="col-md-4"><label class="form-label">${t('active')}</label>
              <select class="form-select" id="empActive">
                <option value="true">${t('active')}</option>
                <option value="false">${t('inactive')}</option>
              </select></div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="submitEmployee()">${t('save')}</button>
        </div>
      </div></div>
    </div>`;
}

function openEmpModal(emp) {
  document.getElementById('empModalTitle').textContent = emp ? t('editEmployee') : t('addEmployee');
  document.getElementById('empCode').value        = emp ? emp.EmployeeCode    : '';
  document.getElementById('empCodeInput').value   = emp ? emp.EmployeeCode    : '';
  document.getElementById('empCodeInput').disabled= !!emp;
  document.getElementById('empNameAr').value      = emp ? emp.EmployeeNameAr  : '';
  document.getElementById('empNameEn').value      = emp ? emp.EmployeeNameEn  : '';
  document.getElementById('empGrade').value       = emp ? emp.JobGrade        : '';
  document.getElementById('empDept').value        = emp ? emp.DepartmentID    : '';
  document.getElementById('empSect').value        = emp ? emp.SectionID       : '';
  document.getElementById('empMobile').value      = emp ? emp.Mobile          : '';
  document.getElementById('empEmail').value       = emp ? emp.Email           : '';
  document.getElementById('empWorkType').value    = emp ? emp.WorkType        : 'Normal';
  document.getElementById('empActive').value      = emp ? emp.ActiveFlag      : 'true';
  new bootstrap.Modal(document.getElementById('empModal')).show();
}

async function submitEmployee() {
  const employee = {
    EmployeeCode:   (document.getElementById('empCode').value || document.getElementById('empCodeInput').value).trim().toUpperCase(),
    EmployeeNameAr: document.getElementById('empNameAr').value.trim(),
    EmployeeNameEn: document.getElementById('empNameEn').value.trim(),
    JobGrade:       document.getElementById('empGrade').value.trim(),
    DepartmentID:   document.getElementById('empDept').value,
    SectionID:      document.getElementById('empSect').value,
    Mobile:         document.getElementById('empMobile').value.trim(),
    Email:          document.getElementById('empEmail').value.trim(),
    WorkType:       document.getElementById('empWorkType').value,
    ActiveFlag:     document.getElementById('empActive').value,
  };
  if (!employee.EmployeeCode || !employee.EmployeeNameAr) {
    showToast(t('requireEmployeeCode'), 'danger'); return;
  }
  const res = await api('saveEmployee', { employee });
  if (res.success) {
    showToast(res.message, 'success');
    bootstrap.Modal.getInstance(document.getElementById('empModal'))?.hide();
    renderEmployees();
  } else { showToast(res.message, 'danger'); }
}

async function deleteEmp(employeeCode) {
  if (!(await confirmDialog())) return;
  const res = await api('deleteEmployee', { employeeCode });
  showToast(res.message, res.success ? 'success' : 'danger');
  if (res.success) renderEmployees();
}

function filterEmpTable(searchVal) {
  const q    = (searchVal || document.getElementById('empSearch')?.value || '').toLowerCase();
  const dept = document.getElementById('empDeptFilter')?.value || '';
  document.querySelectorAll('#empTable tbody tr').forEach(tr => {
    const text    = tr.textContent.toLowerCase();
    const deptTd  = tr.cells[3]?.textContent || '';
    const matchQ  = !q    || text.includes(q);
    const matchD  = !dept || deptTd.includes(dept);
    tr.style.display = (matchQ && matchD) ? '' : 'none';
  });
}

async function loadSectionsByDept(deptID, selectId) {
  const res  = await api('getSections', { departmentID: deptID });
  const sects = res.success ? res.data : [];
  const sel  = document.getElementById(selectId);
  if (!sel) return;
  sel.innerHTML = `<option value="">${t('selectOption')}</option>` +
    sects.map(s => `<option value="${s.SectionID}">${APP.lang==='ar'?s.SectionNameAr:s.SectionNameEn}</option>`).join('');
}

// ── Users ─────────────────────────────────────────────────────
async function renderUsers() {
  const container = document.getElementById('pageContent');
  const [usersRes, empsRes, empsNoAdminRes] = await Promise.all([
    api('getUsers', {}),
    api('getEmployees', { includeAdmin: true }),
    api('getEmployees', {}),
  ]);
  const users = usersRes.success ? usersRes.data : [];
  const emps  = empsRes.success  ? empsRes.data  : [];
  const empsForDropdown = empsNoAdminRes.success ? empsNoAdminRes.data : [];
  const empMap = {}; emps.forEach(e => { empMap[e.EmployeeCode] = e; });
  const empOpts = empsForDropdown.map(e => `<option value="${e.EmployeeCode}">${e.EmployeeCode} — ${e.EmployeeNameAr}</option>`).join('');

  const roleLabel = r => r==='Admin'?`<span class="badge-status badge-danger">${t('adminRole')}</span>`:r==='Manager'?`<span class="badge-status badge-warning">${t('managerRole')}</span>`:`<span class="badge-status badge-secondary">${t('employeeRole')}</span>`;

  const rows = users.map(u => `
    <tr>
      <td>${u.EmployeeCode}</td>
      <td>${empMap[u.EmployeeCode] ? empMap[u.EmployeeCode].EmployeeNameAr : '—'}</td>
      <td>${u.Username}</td>
      <td>${roleLabel(u.Role)}</td>
      <td><span class="badge-status ${String(u.ActiveFlag).toLowerCase()==='true'?'badge-success':'badge-danger'}">${String(u.ActiveFlag).toLowerCase()==='true'?t('active'):t('inactive')}</span></td>
      <td>${parseInt(u.FailedLoginAttempts||0) >= 5 ? `<span class="badge-status badge-danger">${t('locked')}</span>` : u.FailedLoginAttempts||0}</td>
      <td>${u.LastLoginDate ? formatDateAr(u.LastLoginDate) : '—'}</td>
      <td class="action-btns">
        <button class="btn btn-sm btn-outline-primary" onclick="openUserModal(${JSON.stringify(u).replace(/"/g,'&quot;')})">
          <span class="material-icons-round">edit</span></button>
        <button class="btn btn-sm btn-outline-warning" onclick="resetUserPasswordAct('${u.Username}')" title="${t('resetPassword')}">
          <span class="material-icons-round">lock_reset</span></button>
        ${parseInt(u.FailedLoginAttempts||0)>=5?`<button class="btn btn-sm btn-outline-success" onclick="unlockUserAct('${u.Username}')"><span class="material-icons-round">lock_open</span></button>`:''}
        <button class="btn btn-sm btn-outline-danger" onclick="deleteUserAct('${u.UserID}')">
          <span class="material-icons-round">delete</span></button>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <div class="page-header">
      <div><div class="page-header-title">${t('users')}</div></div>
      <button class="btn btn-primary" onclick="openUserModal(null)">
        <span class="material-icons-round">person_add</span>${t('add')}</button>
    </div>
    <div class="card"><div class="data-table-wrapper">
      ${users.length ? `
      <table class="data-table">
        <thead><tr>
          <th>${t('code')}</th><th>${t('name')}</th><th>${t('username')}</th><th>${t('role')}</th>
          <th>${t('active')}</th><th>${t('loginAttempts')}</th><th>${t('lastLogin')}</th><th>${t('actions')}</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty-state"><span class="material-icons-round">manage_accounts</span><div>${t('noData')}</div></div>`}
    </div></div>

    <div class="modal fade" id="userModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="userModalTitle">${t('addUser')}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="uUserID">
          <div class="mb-3"><label class="form-label">${t('employeeRequiredField')}</label>
            <select class="form-select" id="uEmpCode"><option value="">${t('selectOption')}</option>${empOpts}</select></div>
          <div class="mb-3"><label class="form-label">${t('role')} *</label>
            <select class="form-select" id="uRole">
              <option value="Employee">${t('employeeRole')}</option>
              <option value="Manager">${t('managerRole')}</option>
              <option value="Admin">${t('adminRole')}</option>
            </select></div>
          <div class="mb-3"><label class="form-label">${t('password')} <small class="text-secondary">${t('passwordLeaveBlank')}</small></label>
            <input type="password" class="form-control" id="uPass" autocomplete="new-password" placeholder="Password@123"></div>
          <div class="mb-3"><label class="form-label">${t('active')}</label>
            <select class="form-select" id="uActive">
              <option value="true">${t('active')}</option><option value="false">${t('inactive')}</option>
            </select></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="submitUser()">${t('save')}</button>
        </div>
      </div></div>
    </div>`;
}

function openUserModal(u) {
  document.getElementById('userModalTitle').textContent = u ? t('editUser') : t('addUser');
  document.getElementById('uUserID').value   = u ? u.UserID       : '';
  document.getElementById('uEmpCode').value  = u ? u.EmployeeCode : '';
  document.getElementById('uRole').value     = u ? u.Role         : 'Employee';
  document.getElementById('uPass').value     = '';
  document.getElementById('uActive').value   = u ? u.ActiveFlag   : 'true';
  new bootstrap.Modal(document.getElementById('userModal')).show();
}

async function submitUser() {
  const user = {
    UserID:       document.getElementById('uUserID').value,
    EmployeeCode: document.getElementById('uEmpCode').value,
    Role:         document.getElementById('uRole').value,
    Password:     document.getElementById('uPass').value || '***',
    ActiveFlag:   document.getElementById('uActive').value,
  };
  if (!user.EmployeeCode) { showToast(t('chooseEmployeeRequired'), 'danger'); return; }
  const res = await api('saveUser', { user });
  if (res.success) {
    showToast(res.message, 'success');
    bootstrap.Modal.getInstance(document.getElementById('userModal'))?.hide();
    renderUsers();
  } else { showToast(res.message, 'danger'); }
}

async function deleteUserAct(userID) {
  if (!(await confirmDialog())) return;
  const res = await api('deleteUser', { userID });
  showToast(res.message, res.success ? 'success' : 'danger');
  if (res.success) renderUsers();
}

async function unlockUserAct(username) {
  const res = await api('unlockUser', { username });
  showToast(res.message, res.success ? 'success' : 'danger');
  if (res.success) renderUsers();
}

async function resetUserPasswordAct(username) {
  if (!(await confirmDialog(t('resetPasswordConfirm')))) return;
  const res = await api('resetPassword', { username });
  if (res.success) {
    // Shown as a persistent alert rather than a toast — the admin needs to
    // read the temporary password and pass it on to the employee.
    alert(res.message);
    renderUsers();
  } else {
    showToast(res.message, 'danger');
  }
}

// ── Departments & Sections ────────────────────────────────────
async function renderDepartments() {
  const container = document.getElementById('pageContent');
  const [deptsRes, sectsRes, empsRes] = await Promise.all([
    api('getDepartments', {}),
    api('getSections', {}),
    api('getEmployees', {}),
  ]);
  const depts = deptsRes.success ? deptsRes.data : [];
  const sects = sectsRes.success ? sectsRes.data : [];
  const emps  = empsRes.success  ? empsRes.data  : [];
  const empMap  = {}; emps.forEach(e => { empMap[e.EmployeeCode] = e.EmployeeNameAr; });
  const deptMap = {}; depts.forEach(d => { deptMap[d.DepartmentID] = APP.lang==='ar'?d.DepartmentNameAr:d.DepartmentNameEn; });
  const deptOpts= depts.map(d => `<option value="${d.DepartmentID}">${APP.lang==='ar'?d.DepartmentNameAr:d.DepartmentNameEn}</option>`).join('');
  const empOpts = emps.map(e => `<option value="${e.EmployeeCode}">${e.EmployeeCode} — ${e.EmployeeNameAr}</option>`).join('');

  const deptRows = depts.map(d => `
    <tr>
      <td>${d.DepartmentID}</td><td>${d.DepartmentNameAr}</td><td>${d.DepartmentNameEn}</td>
      <td class="action-btns">
        <button class="btn btn-sm btn-outline-primary" onclick="openDeptModal(${JSON.stringify(d).replace(/"/g,'&quot;')})"><span class="material-icons-round">edit</span></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteDept('${d.DepartmentID}')"><span class="material-icons-round">delete</span></button>
      </td>
    </tr>`).join('');

  const sectRows = sects.map(s => `
    <tr>
      <td>${s.SectionID}</td><td>${deptMap[s.DepartmentID]||'—'}</td>
      <td>${s.SectionNameAr}</td><td>${s.SectionNameEn}</td>
      <td>${empMap[s.ManagerEmployeeID]||'—'}</td>
      <td class="action-btns">
        <button class="btn btn-sm btn-outline-primary" onclick="openSectModal(${JSON.stringify(s).replace(/"/g,'&quot;')})"><span class="material-icons-round">edit</span></button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteSect('${s.SectionID}')"><span class="material-icons-round">delete</span></button>
      </td>
    </tr>`).join('');

  container.innerHTML = `
    <div class="page-header"><div><div class="page-header-title">${t('departments')}</div></div></div>
    <div class="row g-3">
      <!-- Departments -->
      <div class="col-12">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center px-3 py-2">
            <span class="fw-bold">${t('departmentsTitle')}</span>
            <button class="btn btn-sm btn-primary" onclick="openDeptModal(null)"><span class="material-icons-round">add</span>${t('add')}</button>
          </div>
          <div class="data-table-wrapper">
            ${depts.length ? `
            <table class="data-table">
              <thead><tr><th>${t('codeLabel')}</th><th>${t('nameArabic')}</th><th>${t('nameEnglish')}</th><th>${t('actions')}</th></tr></thead>
              <tbody>${deptRows}</tbody>
            </table>` : `<div class="empty-state py-4"><span class="material-icons-round">corporate_fare</span><div>${t('noData')}</div></div>`}
          </div>
        </div>
      </div>
      <!-- Sections -->
      <div class="col-12">
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center px-3 py-2">
            <span class="fw-bold">${t('sectionsTitle')}</span>
            <button class="btn btn-sm btn-primary" onclick="openSectModal(null)"><span class="material-icons-round">add</span>${t('add')}</button>
          </div>
          <div class="data-table-wrapper">
            ${sects.length ? `
            <table class="data-table">
              <thead><tr><th>${t('codeLabel')}</th><th>${t('department')}</th><th>${t('nameArabic')}</th><th>${t('nameEnglish')}</th><th>${t('sectionManager')}</th><th>${t('actions')}</th></tr></thead>
              <tbody>${sectRows}</tbody>
            </table>` : `<div class="empty-state py-4"><span class="material-icons-round">group_work</span><div>${t('noData')}</div></div>`}
          </div>
        </div>
      </div>
    </div>

    <!-- Dept Modal -->
    <div class="modal fade" id="deptModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="deptModalTitle">${t('addDepartment')}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="deptID">
          <div class="mb-3"><label class="form-label">${t('nameArabic')} *</label><input class="form-control" id="deptNameAr"></div>
          <div class="mb-3"><label class="form-label">${t('nameEnglish')}</label><input class="form-control" id="deptNameEn"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="submitDept()">${t('save')}</button>
        </div>
      </div></div>
    </div>

    <!-- Section Modal -->
    <div class="modal fade" id="sectModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="sectModalTitle">${t('addSection')}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body">
          <input type="hidden" id="sectID">
          <div class="mb-3"><label class="form-label">${t('department')} *</label>
            <select class="form-select" id="sectDept"><option value="">${t('selectOption')}</option>${deptOpts}</select></div>
          <div class="mb-3"><label class="form-label">${t('nameArabic')} *</label><input class="form-control" id="sectNameAr"></div>
          <div class="mb-3"><label class="form-label">${t('nameEnglish')}</label><input class="form-control" id="sectNameEn"></div>
          <div class="mb-3"><label class="form-label">${t('sectionManager')}</label>
            <select class="form-select" id="sectMgr"><option value="">${t('selectOption')}</option>${empOpts}</select></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">${t('cancel')}</button>
          <button class="btn btn-primary" onclick="submitSect()">${t('save')}</button>
        </div>
      </div></div>
    </div>`;
}

function openDeptModal(d) {
  document.getElementById('deptModalTitle').textContent = d ? t('editDepartment') : t('addDepartment');
  document.getElementById('deptID').value     = d ? d.DepartmentID      : '';
  document.getElementById('deptNameAr').value = d ? d.DepartmentNameAr  : '';
  document.getElementById('deptNameEn').value = d ? d.DepartmentNameEn  : '';
  new bootstrap.Modal(document.getElementById('deptModal')).show();
}
async function submitDept() {
  const department = {

    DepartmentNameAr: document.getElementById('deptNameAr').value.trim(),

            <div class="col-12"><label class="form-label">${t('payrollEndDay')}</label><input type="text" class="form-control" id="s_PayrollMonthEndDayDisplay" value="" readonly></div>
            <div class="col-12"><small class="text-secondary">${t('payrollCycleHint')}</small></div>
            <div class="col-12"><label class="form-label">${t('sessionTimeout')}</label><input type="number" class="form-control" id="s_SessionTimeoutMinutes" value="${s.SessionTimeoutMinutes||'60'}" min="5" max="480"></div>
          </div>
        </div>
      </div>
      <!-- Weekly Off Days -->
      <div class="col-12">
        <div class="card p-3">
          <div class="section-title"><span class="material-icons-round">weekend</span>${t('weeklyOffDays')}</div>
          <div class="row g-2">
            ${[0,1,2,3,4,5,6].map(d => {
              const selected = String(s.WeeklyOffDays||'5,6').split(',').map(x=>x.trim()).includes(String(d));
              return `<div class="col-12">
                <div class="form-check">
                  <input class="form-check-input weekly-off-day-cb" type="checkbox" value="${d}" id="s_offday_${d}" ${selected?'checked':''}>
                  <label class="form-check-label" for="s_offday_${d}">${t('weekday_'+d)}</label>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>`;
  updatePayrollEndDayPreview();
}

// Shows the computed payroll-cycle end day (StartDay - 1, in the following month)
// as a read-only preview next to the editable start day — this field is derived,
// not stored, since the actual period end is always calculated from the start day.
function updatePayrollEndDayPreview() {
  const startEl = document.getElementById('s_PayrollMonthStartDay');
  const dispEl  = document.getElementById('s_PayrollMonthEndDayDisplay');
  if (!startEl || !dispEl) return;
  const startDay = parseInt(startEl.value) || 1;
  if (startDay === 1) {
    dispEl.value = (APP.lang === 'ar') ? 'آخر يوم في نفس الشهر' : 'Last day of the same month';
  } else {
    dispEl.value = String(startDay - 1) + ' ' + t('payrollEndDaySuffix');
  }
}

async function submitSettings() {
  const fields = ['NormalStartTime','NormalFlexibleLatestArrival','NormalRequiredHours','GracePeriodMinutes',
    'RamadanStartTime','RamadanFlexibleLatestArrival','RamadanRequiredHours','RamadanGracePeriodMinutes',
    'RamadanFromDate','RamadanToDate',
    'MonthlyPermissionHours','MonthlyWorkHoursMissionCount',
    'PayrollMonthStartDay','SessionTimeoutMinutes'];
  const settings = {};
  fields.forEach(f => {
    const el = document.getElementById('s_' + f);
    if (el) settings[f] = el.value;
  });

  // Validate Ramadan date range, if both are provided
  if (settings.RamadanFromDate && settings.RamadanToDate && settings.RamadanFromDate > settings.RamadanToDate) {
    showToast(t('ramadanDateRangeError'), 'danger');
    return;
  }

  // Weekly off days — collect checked weekday checkboxes (0=Sunday..6=Saturday)
  const offDays = Array.from(document.querySelectorAll('.weekly-off-day-cb'))
    .filter(cb => cb.checked).map(cb => cb.value);
  settings.WeeklyOffDays = offDays.join(',');

  const res = await api('saveSettings', { settings });
  showToast(res.message, res.success ? 'success' : 'danger');
}

// ── Audit Log ─────────────────────────────────────────────────
async function renderAudit() {
  const container = document.getElementById('pageContent');
  const res  = await api('getAuditLog', {});
  const logs = res.success ? res.data : [];

  const actionBadge = a => {
    const map = { LOGIN:'badge-success', LOGOUT:'badge-secondary', ADD:'badge-info',
      EDIT:'badge-warning', DELETE:'badge-danger', CHECK_IN:'badge-success',
      CHECK_OUT:'badge-info', CHANGE_PASSWORD:'badge-warning', UNLOCK:'badge-success' };
    return `<span class="badge-status ${map[a]||'badge-secondary'}">${a}</span>`;
  };

  const rows = logs.map(l => `
    <tr>
      <td>${l.UserCode}</td>
      <td>${actionBadge(l.Action)}</td>
      <td>${l.TableName}</td>
      <td><small>${l.RecordID}</small></td>
      <td><small>${l.Timestamp}</small></td>
    </tr>`).join('');

  container.innerHTML = `
    <div class="page-header"><div><div class="page-header-title">${t('auditLog')}</div>
      <div class="page-header-sub">${t('last500')}</div></div>
      <button class="btn btn-outline-primary" onclick="renderAudit()"><span class="material-icons-round">refresh</span>${t('refresh')}</button>
    </div>
    <div class="card"><div class="data-table-wrapper" style="max-height:65vh;overflow-y:auto">
      ${logs.length ? `
      <table class="data-table">
        <thead><tr><th>${t('user')}</th><th>${t('actions')}</th><th>${t('table')}</th><th>${t('record')}</th><th>${t('timestamp')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : `<div class="empty-state"><span class="material-icons-round">history</span><div>${t('noData')}</div></div>`}
    </div></div>`;
}

            <div class="mb-2"><small class="text-secondary">${t('section')}:</small> ${sectMap[emp.SectionID]||'—'}</div>

// Resets the signed-in user's OWN password back to the system default — for
// when they've forgotten it and so can't use "Change Password" (which needs
// the current one). Requires an active session, so only someone already
// signed in as this user can do it.
async function resetMyPasswordAct() {
  if (!(await confirmDialog(t('resetPasswordConfirm')))) return;
  const res = await api('resetPassword', { username: APP.session.username || APP.session.employeeCode });
  if (res.success) {
    alert(res.message);
  } else {
    showToast(res.message, 'danger');
  }
}
