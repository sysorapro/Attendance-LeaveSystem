<style>
/* ============================================================
   Global Variables & Theme
   ============================================================ */
:root {
  --primary:        #1a3353;
  --primary-light:  #2556a0;
  --primary-soft:   #eef3fc;
  --accent:         #f59e0b;
  --accent-dark:    #d97706;
  --success:        #10b981;
  --danger:         #ef4444;
  --warning:        #f59e0b;
  --info:           #3b82f6;
  --sidebar-w:      264px;
  --sidebar-bg:     #0d1e35;
  --sidebar-text:   #b8cde8;
  --sidebar-hover:  rgba(255,255,255,0.07);
  --sidebar-active: rgba(245,158,11,0.16);
  --topbar-h:       62px;
  --card-shadow:    0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(30,58,95,0.07);
  --card-shadow-hover: 0 8px 32px rgba(30,58,95,0.14);
  --card-radius:    16px;
  --transition:     0.18s ease;
  --font-ar:        'Cairo', sans-serif;
  --font-en:        'Inter', sans-serif;

  /* Light theme */
  --bg:             #f1f5f9;
  --surface:        #ffffff;
  --surface-2:      #f8fafc;
  --text-primary:   #0f172a;
  --text-secondary: #64748b;
  --border:         #e2e8f0;
  --input-bg:       #ffffff;
  --glow-primary:   rgba(37,86,160,0.15);
}

[data-theme="dark"] {
  --bg:             #0b0f18;
  --surface:        #131929;
  --surface-2:      #1a2235;
  --text-primary:   #e8edf5;
  --text-secondary: #8896ae;
  --border:         #232f45;
  --input-bg:       #1a2235;
  --sidebar-bg:     #080d18;
  --sidebar-text:   #8896ae;
  --card-shadow:    0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
  --card-shadow-hover: 0 8px 32px rgba(0,0,0,0.4);
  --primary-soft:   rgba(37,86,160,0.1);
  --glow-primary:   rgba(37,86,160,0.25);
}

/* ── Base ───────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-ar);
  background: var(--bg);
  color: var(--text-primary);
  margin: 0;
  min-height: 100vh;
  transition: background var(--transition), color var(--transition);
}

[lang="en"] body, .lang-en { font-family: var(--font-en); }

/* ── Global Loader ──────────────────────────────────────────── */
.global-loader {
  position: fixed; inset: 0;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999; transition: opacity 0.5s;
}
.global-loader.hidden { opacity: 0; pointer-events: none; }

/* Morphing blobs loader */
.loader-content { text-align: center; color: #fff; }

.loader-blobs {
  position: relative;
  width: 80px; height: 80px;
  margin: 0 auto 20px;
}
.blob {
  position: absolute;
  border-radius: 50%;
  mix-blend-mode: screen;
}
.blob-1 {
  width: 50px; height: 50px;
  background: var(--accent);
  top: 0; left: 15px;
  animation: blob1 1.8s ease-in-out infinite;
  opacity: 0.9;
}
.blob-2 {
  width: 44px; height: 44px;
  background: #5eead4;
  bottom: 0; left: 0;
  animation: blob2 1.8s ease-in-out infinite 0.3s;
  opacity: 0.85;
}
.blob-3 {
  width: 44px; height: 44px;
  background: #818cf8;
  bottom: 0; right: 0;
  animation: blob3 1.8s ease-in-out infinite 0.6s;
  opacity: 0.85;
}
@keyframes blob1 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(-6px,10px) scale(0.88); }
  66%      { transform: translate(6px,8px) scale(1.08); }
}
@keyframes blob2 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(8px,-8px) scale(1.1); }
  66%      { transform: translate(-4px,-6px) scale(0.9); }
}
@keyframes blob3 {
  0%,100% { transform: translate(0,0) scale(1); }
  33%      { transform: translate(-6px,-8px) scale(0.92); }
  66%      { transform: translate(6px,-10px) scale(1.06); }
}

.loader-dots {
  display: flex; gap: 7px; justify-content: center; align-items: center;
  margin-top: 6px;
}
.loader-dots span {
  width: 6px; height: 6px; border-radius: 50%;
  background: rgba(255,255,255,0.5);
  animation: dotPulse 1.4s ease-in-out infinite;
}
.loader-dots span:nth-child(2) { animation-delay: 0.2s; }
.loader-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dotPulse {
  0%,80%,100% { transform: scale(0.7); opacity: 0.4; }
  40%          { transform: scale(1.2); opacity: 1; }
}

.loader-text { font-size: 14px; opacity: 0.75; margin-top: 10px; letter-spacing: 0.3px; }

/* Page / Table inline loader — wave bars */
.wave-loader {
  display: flex; gap: 5px; align-items: flex-end;
  justify-content: center; height: 36px;
}
.wave-loader span {
  width: 4px; border-radius: 4px;
  background: var(--primary-light);
  animation: waveBar 1s ease-in-out infinite;
}
.wave-loader span:nth-child(1) { height: 12px; animation-delay: 0s; }
.wave-loader span:nth-child(2) { height: 22px; animation-delay: 0.1s; }
.wave-loader span:nth-child(3) { height: 30px; animation-delay: 0.2s; }
.wave-loader span:nth-child(4) { height: 22px; animation-delay: 0.3s; }
.wave-loader span:nth-child(5) { height: 12px; animation-delay: 0.4s; }
@keyframes waveBar {
  0%,100% { transform: scaleY(0.5); opacity: 0.45; }
  50%      { transform: scaleY(1.2); opacity: 1; }
}

/* ── Login Page ─────────────────────────────────────────────── */
.login-page {
  position: fixed; inset: 0;
  background: linear-gradient(145deg, #08152b 0%, #1a3353 50%, #2556a0 100%);
  display: flex; justify-content: center;
  padding: 16px;
  overflow-x: hidden; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.login-page::-webkit-scrollbar { display: none; }
html:has(#loginPage:not(.d-none)), body:has(#loginPage:not(.d-none)) {
  margin: 0; background: #08152b !important; overflow: hidden;
}
.login-page::before {
  content: '';
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 80%, rgba(245,158,11,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 80% 20%, rgba(37,86,160,0.25) 0%, transparent 55%);
  pointer-events: none;
}
.login-card {
  background: rgba(255,255,255,0.97);
  border-radius: 24px;
  padding: 44px 40px;
  width: 100%; max-width: 420px;
  margin: auto;
  box-shadow: 0 24px 80px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
  animation: slideUp 0.5s cubic-bezier(.22,.84,.44,1);
  position: relative;
}
[data-theme="dark"] .login-card {
  background: rgba(19,25,41,0.97);
  box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
}
.login-logo {
  width: 74px; height: 74px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  border-radius: 20px; display: flex; align-items: center; justify-content: center;
  margin: 0 auto 22px;
  box-shadow: 0 10px 30px rgba(30,58,95,0.4), 0 2px 8px rgba(245,158,11,0.2);
}
.login-logo .material-icons-round { font-size: 38px; color: #fff; }
.login-title { font-size: 22px; font-weight: 800; color: var(--text-primary); text-align: center; margin-bottom: 4px; }
.login-subtitle { font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 30px; }
.login-bottom-logo {
  display: flex; align-items: center; justify-content: center;
  margin-top: 14px;
}
.login-bottom-logo img {
  width: 120px; height: auto;
  object-fit: contain;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.10));
}

@media (max-width: 480px) {
  .login-page { padding: 12px; }
  .login-card { padding: 26px 20px; border-radius: 20px; }
  .login-logo { width: 60px; height: 60px; border-radius: 17px; margin-bottom: 14px; }
  .login-logo .material-icons-round { font-size: 32px; }
  .login-title { font-size: 18px; }
  .login-subtitle { font-size: 12px; margin-bottom: 18px; }
  .login-card .form-control { font-size: 14px; }
  .login-card .btn { font-size: 14px; }
  .login-bottom-logo img { width: 96px; }
}
@media (max-height: 640px) {
  .login-card { padding-top: 18px; padding-bottom: 18px; }
  .login-subtitle { margin-bottom: 12px; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(28px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── Sidebar ────────────────────────────────────────────────── */
.sidebar {
  position: fixed; top: 0; right: 0;
  width: var(--sidebar-w); height: 100vh;
  background: var(--sidebar-bg);
  display: flex; flex-direction: column;
  transition: transform var(--transition);
  z-index: 1000;
  overflow-y: auto; overflow-x: hidden;
  border-left: 1px solid rgba(255,255,255,0.04);
}
[dir="ltr"] .sidebar { right: auto; left: 0; border-left: none; border-right: 1px solid rgba(255,255,255,0.04); }

.sidebar-header {
  padding: 20px 16px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 12px;
}
.sidebar-brand-icon {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 4px 12px rgba(245,158,11,0.3);
}
.sidebar-brand-icon .material-icons-round { font-size: 22px; color: #fff; }
.sidebar-brand-name { font-size: 13px; font-weight: 700; color: #fff; line-height: 1.3; }
.sidebar-brand-sub  { font-size: 10px; color: var(--sidebar-text); opacity: 0.7; }

.sidebar-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.4px;
  color: rgba(184,205,232,0.3); text-transform: uppercase;
  padding: 18px 18px 6px;
}

.sidebar-nav { padding: 8px 10px; flex: 1; }

.nav-item-link {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: 12px;
  color: var(--sidebar-text); text-decoration: none;
  cursor: pointer; transition: all var(--transition);
  margin-bottom: 2px; border: none; background: none; width: 100%;
  font-family: var(--font-ar); font-size: 13.5px; font-weight: 500;
}
.nav-item-link:hover { background: var(--sidebar-hover); color: #e8f0fb; }
.nav-item-link.active {
  background: var(--sidebar-active);
  color: var(--accent); font-weight: 700;
  box-shadow: inset 3px 0 0 var(--accent);
}
[dir="ltr"] .nav-item-link.active { box-shadow: inset -3px 0 0 var(--accent); }
.nav-item-link .material-icons-round { font-size: 20px; flex-shrink: 0; }
.nav-badge {
  margin-right: auto; margin-left: 0;
  background: var(--accent); color: #fff;
  border-radius: 10px; padding: 1px 7px; font-size: 10px; font-weight: 700;
}
[dir="ltr"] .nav-badge { margin-left: auto; margin-right: 0; }

.sidebar-footer {
  padding: 12px 10px;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.sidebar-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: 999;
  backdrop-filter: blur(2px);
}

/* ── Topbar ─────────────────────────────────────────────────── */
.topbar {
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 0 var(--border), 0 2px 8px rgba(0,0,0,0.04);
}
.topbar-title { font-size: 17px; font-weight: 700; color: var(--text-primary); flex: 1; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.topbar-btn {
  width: 38px; height: 38px; border-radius: 11px;
  border: 1px solid var(--border); background: var(--surface-2);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-secondary); transition: all var(--transition);
  position: relative;
}
.topbar-btn:hover {
  background: var(--primary-soft);
  color: var(--primary);
  border-color: var(--primary-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--glow-primary);
}
.topbar-btn .material-icons-round { font-size: 20px; }

.user-avatar {
  width: 36px; height: 36px; border-radius: 11px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
  box-shadow: 0 2px 8px var(--glow-primary);
  transition: all var(--transition);
}
.user-avatar:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--glow-primary); }

/* ── Main Layout ────────────────────────────────────────────── */
.main-content {
  margin-right: var(--sidebar-w);
  min-height: 100vh;
  transition: margin var(--transition);
}
[dir="ltr"] .main-content { margin-right: 0; margin-left: var(--sidebar-w); }

.page-content { padding: 24px; }

/* ── Cards ──────────────────────────────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); box-shadow: var(--card-shadow);
  transition: box-shadow var(--transition);
}
.card:hover { box-shadow: var(--card-shadow-hover); }
.card-header { background: transparent; border-bottom: 1px solid var(--border); }

.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--card-radius); padding: 20px;
  display: flex; align-items: center; gap: 16px;
  box-shadow: var(--card-shadow);
  transition: transform var(--transition), box-shadow var(--transition);
  position: relative; overflow: hidden;
}
.stat-card::after {
  content: ''; position: absolute;
  top: 0; right: 0; width: 3px; height: 100%;
  background: var(--accent); border-radius: 0 var(--card-radius) var(--card-radius) 0;
  opacity: 0; transition: opacity var(--transition);
}
[dir="ltr"] .stat-card::after { right: auto; left: 0; border-radius: var(--card-radius) 0 0 var(--card-radius); }
.stat-card:hover { transform: translateY(-3px); box-shadow: var(--card-shadow-hover); }
.stat-card:hover::after { opacity: 1; }

.stat-icon {
  width: 54px; height: 54px; border-radius: 15px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-icon .material-icons-round { font-size: 27px; }
.stat-value { font-size: 27px; font-weight: 800; color: var(--text-primary); line-height: 1; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* ── Data Table ─────────────────────────────────────────────── */
.data-table-wrapper { overflow-x: auto; border-radius: var(--card-radius); }
.data-table {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 13.5px;
}
.data-table thead th {
  background: var(--primary); color: #fff;
  padding: 13px 16px; font-weight: 600;
  white-space: nowrap; position: sticky; top: 0;
}
.data-table thead th:first-child { border-radius: 10px 0 0 0; }
.data-table thead th:last-child  { border-radius: 0 10px 0 0; }
[dir="rtl"] .data-table thead th:first-child { border-radius: 0 10px 0 0; }
[dir="rtl"] .data-table thead th:last-child  { border-radius: 10px 0 0 0; }

.data-table tbody tr {
  transition: background var(--transition);
  border-bottom: 1px solid var(--border);
}
.data-table tbody tr:hover { background: var(--primary-soft); }
.data-table tbody td { padding: 12px 16px; color: var(--text-primary); }
.data-table tbody tr:last-child td:first-child { border-radius: 0 0 0 10px; }
.data-table tbody tr:last-child td:last-child  { border-radius: 0 0 10px 0; }

/* ── Forms ──────────────────────────────────────────────────── */
.form-control, .form-select {
  background: var(--input-bg); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 11px;
  padding: 9px 14px; font-family: var(--font-ar); font-size: 14px;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.form-control:focus, .form-select:focus {
  border-color: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(37,86,160,0.13);
  background: var(--input-bg); color: var(--text-primary);
}
.form-label { font-weight: 600; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }

/* ── Buttons ────────────────────────────────────────────────── */
.btn {
  border-radius: 11px; font-family: var(--font-ar);
  font-weight: 600; font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all var(--transition);
}
.btn-primary   { background: var(--primary); border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); transform: translateY(-1px); box-shadow: 0 4px 14px var(--glow-primary); }
.btn-accent    { background: var(--accent); border: none; color: #fff; }
.btn-accent:hover { background: var(--accent-dark); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(245,158,11,0.3); }
.btn-sm { padding: 5px 12px; font-size: 12px; border-radius: 8px; }
.btn .material-icons-round { font-size: 16px; }

/* ── Badges ─────────────────────────────────────────────────── */
.badge-status {
  padding: 4px 10px; border-radius: 20px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
}
.badge-success  { background: rgba(16,185,129,0.11); color: #059669; }
.badge-danger   { background: rgba(239,68,68,0.11);  color: #dc2626; }
.badge-warning  { background: rgba(245,158,11,0.11); color: #d97706; }
.badge-info     { background: rgba(59,130,246,0.11); color: #2563eb; }
.badge-secondary{ background: rgba(100,116,139,0.11);color: #475569; }

/* ── Modals ─────────────────────────────────────────────────── */
.modal-content {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; box-shadow: 0 24px 80px rgba(0,0,0,0.22);
}
.modal-header { border-bottom: 1px solid var(--border); }
.modal-footer { border-top: 1px solid var(--border); }
.modal-title { font-size: 17px; font-weight: 700; color: var(--text-primary); }



/* ── Page Header ────────────────────────────────────────────── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
}
.page-header-title { font-size: 22px; font-weight: 800; color: var(--text-primary); }
.page-header-sub   { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }

/* ── Search Bar ─────────────────────────────────────────────── */
.search-bar { position: relative; }
.search-bar .form-control { padding-right: 40px; }
[dir="ltr"] .search-bar .form-control { padding-right: 14px; padding-left: 40px; }
.search-icon {
  position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
  color: var(--text-secondary); font-size: 20px; pointer-events: none;
}
[dir="ltr"] .search-icon { right: auto; left: 12px; }

/* ── Toast ──────────────────────────────────────────────────── */
.toast-custom {
  min-width: 280px; border-radius: 14px;
  border: none; font-family: var(--font-ar);
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
  background: var(--surface);
  backdrop-filter: blur(12px);
}
.toast-custom .toast-header {
  border-bottom: none; background: transparent; padding-bottom: 0;
}
.toast-custom .toast-body { padding-top: 4px; font-size: 14px; color: var(--text-primary); }

/* ── Attendance Status Card ─────────────────────────────────── */
.attendance-clock {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  border-radius: var(--card-radius); padding: 28px;
  color: #fff; text-align: center;
  position: relative; overflow: hidden;
}
.attendance-clock::before {
  content: ''; position: absolute;
  top: -40%; right: -20%; width: 200px; height: 200px;
  border-radius: 50%; background: rgba(255,255,255,0.05);
  pointer-events: none;
}
.attendance-clock .clock-time {
  font-size: 48px; font-weight: 800; letter-spacing: -2px;
  font-variant-numeric: tabular-nums; position: relative;
}
.attendance-clock .clock-date { font-size: 15px; opacity: 0.8; position: relative; }

.checkin-btn, .checkout-btn {
  padding: 14px 32px; border-radius: 13px; font-size: 16px;
  font-weight: 700; border: none; cursor: pointer;
  transition: all var(--transition); display: inline-flex; align-items: center; gap: 8px;
}
.checkin-btn  { background: var(--success); color: #fff; }
.checkin-btn:hover  { background: #059669; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(16,185,129,0.38); }
.checkout-btn { background: var(--danger); color: #fff; }
.checkout-btn:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 8px 22px rgba(239,68,68,0.38); }

/* ── Timeline ───────────────────────────────────────────────── */
.timeline { position: relative; padding-right: 24px; }
[dir="ltr"] .timeline { padding-right: 0; padding-left: 24px; }
.timeline::before {
  content: ''; position: absolute;
  right: 9px; top: 0; bottom: 0; width: 2px;
  background: var(--border);
}
[dir="ltr"] .timeline::before { right: auto; left: 9px; }
.timeline-item { position: relative; margin-bottom: 16px; }
.timeline-dot {
  position: absolute; right: -24px; top: 4px;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--primary); border: 3px solid var(--bg);
  display: flex; align-items: center; justify-content: center;
}
[dir="ltr"] .timeline-dot { right: auto; left: -24px; }
