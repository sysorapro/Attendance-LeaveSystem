

<div class="login-card">
  <div class="login-logo">
    <span class="material-icons-round">fingerprint</span>
  </div>
  <h1 class="login-title" data-i18n="systemName">Attendance &amp; Leave System</h1>
  <p class="login-subtitle" data-i18n="loginSubtitle">Sign in to continue</p>

  <div id="loginError" class="alert alert-danger d-none py-2 small" role="alert"></div>

  <form id="loginForm" onsubmit="return handleLoginSubmit(event)" autocomplete="on">
    <div class="mb-3">
      <label class="form-label" data-i18n="username">اسم المستخدم</label>
      <div class="search-bar">
        <input type="text" class="form-control" id="loginUsername"
               name="username" autocomplete="username">
        <span class="material-icons-round search-icon" style="pointer-events:none">person</span>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label" data-i18n="password">كلمة المرور</label>
      <div class="search-bar">
        <input type="password" class="form-control" id="loginPassword"
               name="password" autocomplete="current-password">
        <span class="material-icons-round search-icon" id="togglePasswordIcon"
              style="pointer-events:all;cursor:pointer"
              onmousedown="showPassword('loginPassword','togglePasswordIcon')"
              onmouseup="hidePassword('loginPassword','togglePasswordIcon')"
              onmouseleave="hidePassword('loginPassword','togglePasswordIcon')"
              ontouchstart="showPassword('loginPassword','togglePasswordIcon')"
              ontouchend="hidePassword('loginPassword','togglePasswordIcon')">visibility</span>
      </div>
    </div>

    <!-- Remember Me -->
    <div class="mb-4 d-flex align-items-center gap-2">
      <input type="checkbox" class="form-check-input m-0" id="rememberMe" style="width:18px;height:18px;cursor:pointer">
      <label for="rememberMe" class="mb-0 small" style="cursor:pointer;color:var(--text-secondary)" data-i18n="rememberMe">تذكر اسم المستخدم</label>
    </div>

    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3" id="loginBtn">
      <span class="material-icons-round">login</span>
      <span data-i18n="login">تسجيل الدخول</span>
    </button>

    <button type="button" class="btn btn-outline-primary w-100 py-2 fw-bold mb-3 d-none" id="bioLoginBtn" onclick="bioLogin()">
      <span class="material-icons-round">fingerprint</span>
      <span id="bioLoginLabel" data-i18n="bioLoginBtn">الدخول بالبصمة</span>
    </button>
  </form>

  <!-- Language & Theme toggles on login -->
  <div class="d-flex justify-content-center gap-3 mt-3">
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleLang()">
      <span class="material-icons-round" style="font-size:16px">translate</span>
      <span id="langBtnLabel">A</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary" onclick="toggleTheme()">
      <span class="material-icons-round" id="themeIcon" style="font-size:16px">dark_mode</span>
    </button>
    <button class="btn btn-sm btn-outline-secondary" id="sfxToggleBtnLogin" onclick="sfxToggle()" title="تشغيل / إيقاف الأصوات">
      <span class="material-icons-round" id="sfxToggleIconLogin" style="font-size:16px">volume_up</span>
    </button>
  </div>

  <p class="text-center mt-3 mb-0" style="font-size:11px;color:var(--text-secondary)">
    <span data-i18n="loginFooter">v3.0 &copy; 2026 — Attendance & Leave System</span>
  </p>
  <p class="text-center mt-3 mb-0" style="font-size:15px; color:var(--text-secondary); font-weight:bold;">
    <span data-i18n="devBy">Developed By ~ SYSORA ~</span>
  </p>
</div>
